<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="./example.css" />
  </head>
  <body>
    <div id="card">
      <p>id: 123456789</p>
      <div class="img">
        <img
          src="https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=765&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Product image"
        />
      </div>
      <h4>Apple IPhone 15 Pro</h4>
      <div class="rating">
        <span>⭐⭐⭐⭐⭐</span>
        <i class="fa-regular fa-comment-dots"></i>
        <span>97</span>
      </div>

      <div class="pricing">
        <div>
          <span>$999.00</span>
          <span>-10%</span>
        </div>

        <h1>$899.00</h1>
      </div>
      <div class="button">
        <button type="button"><i class="fa-solid fa-cart-shopping"></i></button>
      </div>
    </div>

    <script
      src="https://kit.fontawesome.com/f8ae938eee.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
