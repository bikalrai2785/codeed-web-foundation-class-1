<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditionals</title>
  </head>
  <body>
    <script>
      // syntax:
      // if(evalution) {
      //   do something
      // }

      // if(evaluation) {
      //   do something
      // } else {
      //   do something else
      // }

      // if(evaluation) {
      //   do something
      // } else if (evaluation) {
      //   do something
      // } else if(evaluation) {
      //   do something
      // } else {
      //   do something else
      // }

      // evaluation => boolean(true or false)

      let age = 25;

      if (age < 18) {
        console.log('Ineligible to vote');
      }

      if (age < 18) {
        console.log('Ineligible to vote');
      } else {
        console.log('Eligible to vote');
      }

      const grade = 33;

      if (grade >= 85) {
        console.log('A+');
      } else if (grade < 85 && grade >= 70) {
        console.log('A');
      } else if (grade < 70 && grade >= 50) {
        console.log('B');
      } else if (grade < 50 && grade >= 32) {
        console.log('C');
      } else {
        console.log('Fail');
      }

      // ternary operator => syntax:
      // evaluation ? if true run this : else run this

      grade <= 32 ? console.log('fail') : console.log('pass');

      grade < 70 && grade >= 50 ? console.log('B') : console.log('Other');
    </script>
  </body>
</html>
